[project]
name = "vpatch"
version = "0.1.0"
description = "Compressed-domain patch extraction: codec metadata (motion vectors, per-macroblock QP, frame structure) as VLM patch features"
readme = "README.md"
authors = [
    { name = "Mazhar Shaikh", email = "mazhar@hakimo.ai" }
]
requires-python = ">=3.12"
dependencies = [
    "av>=18.1.0",
    # Floor kept low deliberately: vLLM pins numba==0.65.0, which caps numpy below
    # 2.5, so a 2.5 floor makes the documented `vpatch[vllm]` install unsatisfiable.
    # Nothing here needs a recent numpy -- bincount, lexsort and minimum.at are ancient.
    "numpy>=1.26",
]

[project.optional-dependencies]
# Unused by the runtime package -- vpatch never imports vllm (see tests/test_export.py).
# Present so `pip install vpatch[vllm]` provisions a version the documented seam matches.
vllm = ["vllm>=0.28.0"]

[project.scripts]
vpatch = "vpatch.cli:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
